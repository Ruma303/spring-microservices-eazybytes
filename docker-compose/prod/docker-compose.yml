services:

  configserver:
    image: "rumadev/configserver:s6"
    container_name: configserver-ms-prod
    platform: linux/amd64
    ports:
      - "8071:8071"
    healthcheck:
      test: [ "CMD-SHELL", "wget --spider -q http://localhost:8071/actuator/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    extends:
      file: common-config.yml
      service: microservice-base-config

  accounts:
    image: "rumadev/accounts:s6"
    container_name: accounts-ms-prod
    platform: linux/amd64
    ports:
      - "8080:8080"
    environment:
      SPRING_APPLICATION_NAME: "accounts"
    depends_on:
      configserver:
        condition: service_healthy
    extends:
      file: common-config.yml
      service: microservice-configserver-config

  cards:
    image: "rumadev/cards:s6"
    container_name: cards-ms-prod
    platform: linux/amd64
    ports:
      - "8090:8090"
    environment:
      SPRING_APPLICATION_NAME: "cards"
    depends_on:
      configserver:
        condition: service_healthy
    extends:
      file: common-config.yml
      service: microservice-configserver-config

  loans:
    image: "rumadev/loans:s6"
    container_name: loans-ms-prod
    platform: linux/amd64
    ports:
      - "8100:8100"
    environment:
      SPRING_APPLICATION_NAME: "loans"
    depends_on:
      configserver:
        condition: service_healthy
    extends:
      file: common-config.yml
      service: microservice-configserver-config

networks:
  rumadev:
    driver: bridge
server:
  port: 8071

spring:
  application:
    name: "configserver"
  profiles:
    active: git
  cloud:
    config:
      server:
         git:
           uri: https://github.com/Ruma303/spring-microservices-eazybytes-config.git
           default-label: main
           timeout: 5
           clone-on-start: true
           force-pull: true

# Inserito nelle variabili d'ambiente del modulo configserver
#encrypt:
#  key: ""

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  health:
    readiness-state:
      enabled: true
    liveness-state:
      enabled: true
  endpoint:
    shutdown:
      enabled: true
      health:
        probes:
          enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
